name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, and browserless tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Unit tests (no browser required)
        run: pnpm test

  browser:
    name: Real Chromium regressions (Chrome ${{ matrix.chrome.major }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chrome:
          - major: '151'
            version: '151.0.7922.138'
          - major: '154'
            version: '154.0.8037.92'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chrome for Testing
        id: chrome
        # browser-actions/setup-chrome v2 pinned to immutable commit 48ad923757ca74d66703209fe939badbdf80f2f4
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: ${{ matrix.chrome.version }}
          install-dependencies: true
      - name: Verify pinned browser version
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          EXPECTED_CHROME_VERSION: ${{ matrix.chrome.version }}
        run: |
          version_output="$("$CHROME_BIN" --version)"
          echo "$version_output"
          case "$version_output" in
            *"$EXPECTED_CHROME_VERSION"*) ;;
            *) echo "Expected Chrome for Testing $EXPECTED_CHROME_VERSION" >&2; exit 1 ;;
          esac
      - name: Real Chromium viewport, touch, dialog, and keyboard regressions
        run: pnpm test:browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
