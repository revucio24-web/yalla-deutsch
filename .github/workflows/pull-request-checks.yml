name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and real Chromium regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (no browser required)
        run: pnpm test
      - name: Install pinned Chrome for Testing
        id: chrome
        # browser-actions/setup-chrome v2 pinned to immutable commit 48ad923757ca74d66703209fe939badbdf80f2f4
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '154.0.8037.92'
          install-dependencies: true
      - name: Verify pinned browser version
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          version_output="$("$CHROME_BIN" --version)"
          echo "$version_output"
          case "$version_output" in
            *154.0.8037.92*) ;;
            *) echo 'Expected Chrome for Testing 154.0.8037.92' >&2; exit 1 ;;
          esac
      - name: Real Chromium viewport and dialog regressions
        run: pnpm test:browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
